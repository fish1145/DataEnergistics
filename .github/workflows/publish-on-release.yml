name: Publish on Release

on:
  release:
    types: [released]

jobs:
  meta:
    name: Metadata
    runs-on: ubuntu-latest
    outputs:
      CHANGELOG: ${{ steps.changelog.outputs.changelog }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Get Config
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: '.github/json'
      - name: Generate changelog
        id: changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: './.github/json/config-1.21.json'
          ignorePreReleases: true
          fetchViaCommits: true
          failOnError: true

  publish-21:
    name: 1.21.1
    needs: [ meta ]
    if: ${{ contains(github.ref_name, '1.21') }}
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    uses: ./.github/workflows/publish.yml
    with:
      simulate: ${{ startsWith(github.event.release.name, 'simulate') || github.repository_owner != 'fish1145' }}
      tag-name: ${{ github.ref_name }}
      version: '1.21'
      release-body: ${{ github.event.release.body }}
      changelog-body: ${{ needs.meta.outputs.CHANGELOG }}
