name: Bug Report / 错误报告
description: Report a bug where something is not working as expected. / 报告未按预期工作的错误。
labels: [ "type: bug" ]
body:
  - type: checkboxes
    id: existing-issue
    attributes:
      label: Checked for existing issues / 已检查现有问题
      description: You have checked for existing reports of this issue, open or closed. / 您已检查过开放或已关闭的现有报告。
      options:
        - label: "I have checked for existing issues, and have found none. / 我已检查现有问题，未发现相同报告。"
          required: true
  - type: checkboxes
    id: tried-latest
    attributes:
      label: Tested latest version / 已测试最新版本
      description: You have checked that this issue occurs on the latest version of Data Energistics. / 您已确认此问题会在 Data Energistics 最新版本中出现。
      options:
        - label: "I have checked that this occurs on the latest version. / 我已确认此问题在最新版本中出现。"
          required: true
  - type: input
    id: dataenergistics-version
    attributes:
      label: Data Energistics Version / Data Energistics 版本
      description: The version of Data Energistics you were using when this bug was encountered. If you do not know where to find this, look for the mod jar file in the mods folder, or in the mods viewer in-game. / 遇到此错误时使用的 Data Energistics 版本。如果不知道如何查找，请查看 mods 文件夹中的 mod jar 文件，或游戏内的模组查看器。
      placeholder: "Example: v1.0.0 / 例如：v1.0.0"
    validations:
      required: true
  - type: input
    id: ae2-version
    attributes:
      label: Applied Energistics 2 Version / Applied Energistics 2 版本
      description: The version of Applied Energistics 2 you were using when this bug was encountered. / 遇到此错误时使用的 Applied Energistics 2 版本。
      placeholder: "Example: 19.0.0 / 例如：19.0.0"
    validations:
      required: true
  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft Version / Minecraft 版本
      description: The version of Minecraft you were using when this bug was encountered. Any version not listed is not supported. / 遇到此错误时使用的 Minecraft 版本。未列出的版本均不受支持。
      options:
        - "1.21.1 NeoForge"
    validations:
      required: true
  - type: dropdown
    id: recipe-viewer
    attributes:
      label: Recipe Viewer Installed / 已安装的配方查看器
      description: The recipe viewer installed. / 已安装的配方查看器。
      options:
        - "JEI"
        - "REI"
        - "EMI"
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Environment / 环境
      description: How you were playing on the world. Hybrid servers are unsupported. / 您在世界中的游玩方式。不支持混合服务器。
      options:
        - "Singleplayer / 单人游戏"
        - "Multiplayer - Open to LAN / 多人游戏 - 开放局域网"
        - "Multiplayer - Dedicated Server / 多人游戏 - 专用服务器"
    validations:
      required: true
  - type: dropdown
    id: cross-mod
    attributes:
      label: Cross-Mod Interaction / 跨模组交互
      description: Does this bug occur because of another mod installed alongside Data Energistics? / 此错误是否由与 Data Energistics 同时安装的其他模组引起？
      options:
        - "Yes / 是"
        - "No / 否"
        - "Unsure / 不确定"
    validations:
      required: true
  - type: textarea
    id: other-mods
    attributes:
      label: Other Installed Mods / 其他已安装模组
      description: Enter the name of the modpack you're playing, or list all mods you have installed here. / 输入您正在游玩的整合包名称，或在此列出所有已安装的模组。
      placeholder: "Example: AE2, EMI, Jade, ModernFix... / 例如：AE2, EMI, Jade, ModernFix..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / 预期行为
      description: What you expected to happen. Attach screenshots here as necessary. / 您期望发生什么。必要时请在此附加截图。
      placeholder: "Example: Expected to store X by consuming Y. / 例如：期望通过消耗 Y 来存储 X。"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual Behavior / 实际行为
      description: What happened despite your expectations. Attach screenshots here as necessary. / 与预期不符的实际发生情况。必要时请在此附加截图。
      placeholder: "Example: Stored one X but Y was not consumed. / 例如：存储了一个 X 但 Y 未被消耗。"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce / 重现步骤
      description: How to reproduce the bug. / 如何重现此错误。
      placeholder: "Example: 1) Place X... 2) Insert Y... / 例如：1) 放置 X... 2) 放入 Y..."
    validations:
      required: true
  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information / 附加信息
      description: Any additional information you wish to provide. Please add anything which did not fit into the other sections here. / 您希望提供的任何附加信息。请将不适合其他部分的内容添加在此处。
      placeholder: "Example: This is likely caused by X because... / 例如：这很可能由 X 引起，因为..."
    validations:
      required: false
  - type: markdown
    attributes:
      value: Thank you for taking the time to fill out this bug report. / 感谢您抽出时间填写此错误报告。
