[versions]
minecraft = "1.21.1"
neoForge = "21.1.219"
loader = "4"
parchment = "2024.11.17" # https://parchmentmc.org/docs/getting-started
shadow = "9.4.0"
spotless = "8.6.0"
modDevGradle = "2.0.141"
lombok = "9.2.0"
modaccessor = "1.1"
jetbrains-annotations = "26.0.1"
junit-jupiter = "5.10.2"
junit-platform = "1.10.2"
renderNurse = "0.0.26"
mixin = "0.8.7"
ojalgo = "57.1.0"

[libraries]
minecraft               = { module = "com.mojang:minecraft", version.ref = "minecraft" }
neoForge                = { module = "net.neoforged:neoforge", version.ref = "neoForge" }
testframework           = { module = "net.neoforged:testframework", version.ref = "neoForge" }
jetbrains-annotations   = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
junit-jupiter            = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher  = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
renderNurse             = { module = "net.neoforged:render-nurse", version.ref = "renderNurse" }
mixin                   = { module = "org.spongepowered:mixin", version.ref = "mixin" }
ojalgo                  = { module = "org.ojalgo:ojalgo", version.ref = "ojalgo" }

[plugins]
modDevGradle            = { id = "net.neoforged.moddev", version.ref = "modDevGradle" }
shadow                  = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless                = { id = "com.diffplug.spotless", version.ref = "spotless" }
lombok                  = { id = "io.freefair.lombok", version.ref = "lombok" }
modaccessor             = { id = "dev.vfyjxf.modaccessor", version.ref = "modaccessor" }
